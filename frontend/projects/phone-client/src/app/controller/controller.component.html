<div class="controller" [class.connected]="connected()" [class.game-active]="gameStarted()">
  @if (!connected()) {
    <div class="status">
      <div class="spinner"></div>
      <p>{{ reconnecting() ? 'Reconnecting...' : 'Connecting to game...' }}</p>
    </div>
  } @else if (!gameStarted()) {
    <div class="status">
      <p class="waiting">Waiting for host to start game</p>
      <div class="ready-indicator">Ready</div>
    </div>
  } @else {
    <div class="split-controller" [class.landscape]="isLandscape()">
      <button
        class="zone up-zone"
        (pointerdown)="onZoneDown('up')"
        (pointerup)="onZoneUp()"
        (pointerleave)="onZoneUp()"
        (pointercancel)="onZoneUp()"
      >
        <span class="arrow">&#9650;</span>
      </button>
      <button
        class="zone down-zone"
        (pointerdown)="onZoneDown('down')"
        (pointerup)="onZoneUp()"
        (pointerleave)="onZoneUp()"
        (pointercancel)="onZoneUp()"
      >
        <span class="arrow">&#9660;</span>
      </button>
    </div>
  }
</div>
